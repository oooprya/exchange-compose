<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ExPrivat — оновлення</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111827;
            color: #f9fafb;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 30px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 45px;
            color: #facc15;
        }

        .card {
            padding: 40px 30px;

            background: #1f2937;

            border: 1px solid #374151;
            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .loader {
            width: 56px;
            height: 56px;

            margin: 0 auto 28px;

            border: 4px solid #374151;
            border-top-color: #facc15;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            margin: 0 0 14px;

            font-size: 26px;
            line-height: 1.25;
        }

        p {
            margin: 0;

            color: #9ca3af;

            font-size: 16px;
            line-height: 1.6;
        }

        .status {
            margin-top: 25px;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 8px 14px;

            background: rgba(250, 204, 21, 0.1);
            border-radius: 999px;

            color: #facc15;

            font-size: 14px;
        }

        .dot {
            width: 8px;
            height: 8px;

            background: #facc15;

            border-radius: 50%;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .footer {
            margin-top: 25px;

            color: #6b7280;

            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        🕵️ ExPrivat
    </div>

    <div class="card">

        <div class="loader"></div>

        <h1>
            🔄 Система тимчасово недоступна
        </h1>

        <p>
            Виконується оновлення ExPrivat.
            <br>
            Ваші дані в безпеці.
        </p>

        <div class="status">
            <span class="dot"></span>
            Система оновлюється
        </div>

    </div>

    <div class="footer">
        Сторінка оновиться автоматично
    </div>

</div>


<script>

    async function checkServer() {

        try {

            const response = await fetch(
                window.location.href,
                {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "X-Maintenance-Check": "1"
                    }
                }
            );

            /*
             * Если backend снова отвечает,
             * Nginx получит нормальный ответ.
             */

            if (response.status >= 200 &&
                response.status < 400) {

                window.location.reload();

            }

        } catch (error) {

            console.log(
                "Сервер ещё недоступен..."
            );

        }

    }


    /*
     * Проверяем каждые 5 секунд.
     */
    setInterval(checkServer, 5000);

</script>

</body>
</html>
